<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>

    <style>
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: linear-gradient(135deg, #e9fff6, #c8f9e6);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .thankyou-box {
            background: #ffffff;
            padding: 40px 50px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            max-width: 450px;
            width: 90%;
        }

        .thankyou-box h1 {
            font-size: 40px;
            color: #044434;
            margin-bottom: 10px;
        }

        .thankyou-box p {
            font-size: 16px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-home {
            background: #044434;
            color: white;
            padding: 12px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 17px;
            display: inline-block;
            transition: 0.3s;
        }

        .btn-home:hover {
            background: #067a5a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="thankyou-box">
        <h1>Thank You!</h1>
        <p>Your message has been successfully sent.<br>
           I appreciate you taking the time to connect.<br>
           I will get back to you soon.</p>

        <a href="index.html" class="btn-home">Go Back Home</a>
    </div>

</body>
</html>
